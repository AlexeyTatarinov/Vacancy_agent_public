name: Diagnose page

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page URL to read with the browser reader"
        required: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Diagnose
        env:
          URL: ${{ inputs.url }}
        run: python -m agent.diag "$URL"
