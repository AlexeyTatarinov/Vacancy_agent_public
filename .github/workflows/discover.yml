name: Discover companies

on:
  workflow_dispatch:
    inputs:
      max_new:
        description: "Max new candidates to verify (0 = from config)"
        default: "60"
      gemini_set:
        description: "Gemini query list from config/discovery.json (only used when gemini=true)"
        default: "gemini_queries"
      gemini:
        description: "Also ask Gemini for candidate names (true/false; off by default to save the free quota)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m agent.discover --max-new "${{ inputs.max_new }}" ${{ inputs.gemini == 'true' && format('--gemini --gemini-set {0}', inputs.gemini_set) || '' }}
      - name: Commit candidates
        run: |
          git config user.name "vacancy-bot"
          git config user.email "vacancy-bot@users.noreply.github.com"
          git add state/candidates.json docs/candidates.md
          git diff --cached --quiet || (git commit -m "Candidates $(date -u +%F)" && git push)
